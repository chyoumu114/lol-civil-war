name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lol_civil_war
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LCW_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
          cp -R web/dist/. internal/webui/dist/

      - name: Vet
        run: go vet ./...

      - name: Static analysis (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity medium -confidence medium ./...

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: npm audit (production deps)
        run: npm audit --prefix web --omit=dev --audit-level=high

      - name: Test (MySQL integration)
        run: go test ./...

      - name: Build
        run: go build -trimpath -ldflags "-s -w" ./cmd/lol-civil-war
